<!DOCTYPE html>
<html>
<head>
    <title>QMart Login</title>
</head>

<body>

    <h1>QMart</h1>

    <h2 id="roleTitle"></h2>

    <input type="text" id="username" placeholder="Email">
    <br><br>

    <input type="password" id="password" placeholder="Password">
    <br><br>

    <button onclick="login()">Login</button>
    <button onclick="openRegister()">Register</button>

    <script>

        const params = new URLSearchParams(window.location.search);
        const role = params.get("role");

        if (role === "manager") {
            document.getElementById("roleTitle").innerText = "Manager";
        }
        else if (role === "shopowner") {
            document.getElementById("roleTitle").innerText = "Shop Owner";
        }


        async function login() {

            const data = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            };

            let url;

            if (role === "manager") {
                url = "http://localhost:8080/managerlogin";
            }
            else if (role === "shopowner") {
                url = "http://localhost:8080/shopownerlogin";
            }

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            alert(result.message);

            if (result.success) {

    if (result.role === "Manager") {

        localStorage.setItem("managerId", result.pk);

        window.location.href = "manager.html";
    }
    else if (result.role === "Shop Owner") {
        localStorage.setItem("ownerId", result.pk);
        window.location.href = "shopowner.html";
    }

}
        }


        function openRegister() {
            window.location.href = "register.html" + window.location.search;
        }

    </script>

</body>
</html>
