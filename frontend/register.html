<!DOCTYPE html>
<html>
<head>
    <title>QMart Registration</title>
</head>

<body>

    <h1>QMart</h1>

    <h2 id="roleTitle"></h2>

    <input type="text" placeholder="Name">
    <br><br>

    <input type="text" placeholder="Phone">
    <br><br>

    <input type="email" placeholder="Email">
    <br><br>

    <input type="password" id="password" placeholder="Password">
    <br><br>
    <div id="masterPasswordDiv">
    <input type="password" id="masterPassword" placeholder="Master Password">
    <br><br>
</div>

    <button onclick="register()">Register</button>
    <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role");

    if (role === "manager") {
        document.getElementById("roleTitle").innerText = "Manager Registration";
    }
    else if (role === "shopowner") {
        document.getElementById("roleTitle").innerText = "Shop Owner Registration";
    }
    const masterPasswordDiv = document.getElementById("masterPasswordDiv");

if (role === "manager") {
    document.getElementById("roleTitle").innerText = "Manager Registration";
}
else if (role === "shopowner") {
    document.getElementById("roleTitle").innerText = "Shop Owner Registration";
    masterPasswordDiv.style.display = "none";
}
async function register() {

    const data = {
        name: document.querySelector('input[placeholder="Name"]').value,
        phone: document.querySelector('input[placeholder="Phone"]').value,
        email: document.querySelector('input[placeholder="Email"]').value,
        password: document.getElementById("password").value
    };

    let url;

    if (role === "manager") {

        data.masterPassword = document.getElementById("masterPassword").value;
        url = "http://localhost:8080/addmanager";

    }
    else if (role === "shopowner") {

        url = "http://localhost:8080/addshopowners";
    }

    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.text();

    alert(result);
    if (response.ok) {
    window.location.href = "auth.html" + window.location.search;
}
}

</script>

</body>
</html>
